<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>JINXISTRY｜機會與命運的人生規劃局</title>
</head>

<body>

  <!-- 機關招牌 -->
  <header class="site-header">
    <p class="header-label">THE OFFICIAL ESTABLISHMENT</p>
    <h1>JINXISTRY</h1>
    <h2>機會與命運的人生規劃局</h2>
  </header>

  <!-- 大廳主視覺 -->
  <main class="lobby">

    <section class="hero">
      <p class="hero-label">WELCOME, DEAR VISITOR</p>
      <h2>生活小事<br>交由機率決定</h2>
      <p class="hero-description">
        您只需要選擇服務類型
      </p>
    </section>

    <!-- 三個服務入口 -->
    <section class="service-grid">

      <div class="service-card dice-card">
        <div class="service-icon">⚄</div>
        <h3>骰子部</h3>
        <p>擲骰決定</p>
      </div>

      <div class="service-card wheel-card">
        <div class="service-icon">◉</div>
        <h3>轉盤部</h3>
        <p>轉動命運</p>
      </div>

      <div class="service-card draw-card">
        <div class="service-icon">▤</div>
        <h3>抽籤部</h3>
        <p>抽取指示</p>
      </div>

    </section>

  </main>

  <!-- 頁尾 -->
  <footer class="site-footer">
    JINXISTRY · YOUR LIFE, OUR RANDOM DECISION
  </footer>

</body>
</html>
